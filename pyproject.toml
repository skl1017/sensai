[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensai"
version = "0.1.0"
description = "Sensai: a pure-Python AI agent, no framework."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["core*", "llm*", "tools*", "nodes*", "storage*", "ui*"]

[tool.setuptools]
py-modules = ["app", "config_loader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: integration tests requiring Ollama",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
