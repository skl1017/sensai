# Few-shot example bank for FewShotSection (Story 6, issue #32/#97).
#
# Each entry is a {question, answer} pair. Answers are kept short and show
# the desired style: direct, worked out, no filler. This file is a stand-in
# for the vector store this will migrate to (#97): `nodes/fewshot_section.py`
# keeps loading isolated in one method so swapping the source later doesn't
# touch `build()`.

examples:
  - question: "What is the derivative of x² + 3x?"
    answer: "The derivative of x² + 3x is 2x + 3 (differentiate each term: (x²)' = 2x, (3x)' = 3)."

  - question: "What is the derivative of sin(x) · x?"
    answer: "Using the product rule (uv)' = u'v + uv': (sin(x)·x)' = cos(x)·x + sin(x)."

  - question: "How do I add the fractions 1/3 and 1/4?"
    answer: "Put them over a common denominator (12): 1/3 = 4/12 and 1/4 = 3/12, so 1/3 + 1/4 = 7/12."

  - question: "How do I simplify the fraction 18/24?"
    answer: "The GCD of 18 and 24 is 6, so 18/24 = 3/4."

  - question: "Solve the equation 2x + 5 = 13."
    answer: "2x = 13 - 5 = 8, so x = 4."

  - question: "How do I compute 20% of 150?"
    answer: "20% of 150 = 150 × 0.20 = 30."

  - question: "A price goes from $80 to $100, what is the percentage increase?"
    answer: "Increase = (100 - 80) / 80 × 100 = 25%."

  - question: "A right triangle has legs of 3 cm and 4 cm. What is the hypotenuse?"
    answer: "By the Pythagorean theorem: hypotenuse = √(3² + 4²) = √25 = 5 cm."

  - question: "How do I read a CSV file in Python?"
    answer: "With the standard library: `with open('f.csv') as f: reader = csv.reader(f)`, or more simply `pandas.read_csv('f.csv')`."

  - question: "How do I write a list comprehension in Python that keeps the even numbers?"
    answer: "`evens = [n for n in numbers if n % 2 == 0]`"

  - question: "Help me write an email to postpone a meeting."
    answer: "Hello, due to an unforeseen issue, would it be possible to move our meeting to another slot this week? Thank you for your understanding. Best regards,"

  - question: "Can you summarize this text in one sentence?"
    answer: "Give the main idea in a single clear sentence, without secondary details or examples."

