# Few-shot example bank for FewShotSection (Story 6, issue #32/#97).
#
# Each entry is a {question, answer} pair in French (the app's users write
# in French). Answers are kept short and show the desired style: direct,
# worked out, no filler. This file is a stand-in for the vector store this
# will migrate to (#97): `nodes/fewshot_section.py` keeps loading isolated
# in one method so swapping the source later doesn't touch `build()`.

examples:
  - question: "Quelle est la dérivée de x² + 3x ?"
    answer: "La dérivée de x² + 3x est 2x + 3 (on dérive chaque terme : (x²)' = 2x, (3x)' = 3)."

  - question: "Quelle est la dérivée de sin(x) · x ?"
    answer: "En appliquant la règle du produit (uv)' = u'v + uv' : (sin(x)·x)' = cos(x)·x + sin(x)."

  - question: "Comment additionner les fractions 1/3 et 1/4 ?"
    answer: "On les met au même dénominateur (12) : 1/3 = 4/12 et 1/4 = 3/12, donc 1/3 + 1/4 = 7/12."

  - question: "Comment simplifier la fraction 18/24 ?"
    answer: "Le PGCD de 18 et 24 est 6, donc 18/24 = 3/4."

  - question: "Résous l'équation 2x + 5 = 13."
    answer: "2x = 13 - 5 = 8, donc x = 4."

  - question: "Comment calculer 20 % de 150 ?"
    answer: "20 % de 150 = 150 × 0,20 = 30."

  - question: "Un prix passe de 80 € à 100 €, quelle est l'augmentation en pourcentage ?"
    answer: "Augmentation = (100 - 80) / 80 × 100 = 25 %."

  - question: "Un triangle rectangle a des côtés de 3 cm et 4 cm. Quelle est l'hypoténuse ?"
    answer: "D'après le théorème de Pythagore : hypoténuse = √(3² + 4²) = √25 = 5 cm."

  - question: "Comment lire un fichier CSV en Python ?"
    answer: "Avec le module standard : `with open('f.csv') as f: reader = csv.reader(f)`, ou plus simplement `pandas.read_csv('f.csv')`."

  - question: "Comment écrire une liste en compréhension en Python pour garder les nombres pairs ?"
    answer: "`pairs = [n for n in nombres if n % 2 == 0]`"

  - question: "Aide-moi à rédiger un e-mail pour reporter une réunion."
    answer: "Bonjour, en raison d'un imprévu, serait-il possible de reporter notre réunion à un autre créneau cette semaine ? Merci de votre compréhension. Cordialement,"

  - question: "Peux-tu résumer ce texte en une phrase ?"
    answer: "Donne l'idée principale en une seule phrase claire, sans les détails secondaires ni les exemples."
