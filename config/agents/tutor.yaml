# Sub-agent exposed as `ask_tutor` by the `agents:` section of agent.yaml (A2,
# wiki §8.8). An ordinary agent.yaml: own persona, a subset of tools, and a
# lighter pipeline (no persist, no RAG). Personas and prompts resolve against
# the parent's config dir (config/), not config/agents/.

llm:
  provider: ollama
  model: qwen2.5:3b
  embed_model: nomic-embed-text
  host: http://localhost:11434
  max_context_tokens: 8192

persona: tutor                   # config/personas/tutor.yaml
prompt_version: v2

pipeline:
  - context: { sections: [persona] }
  - react: { max_iterations: 4, tool_timeout: 30, max_observation_chars: 2000 }

tools:
  - calculator
