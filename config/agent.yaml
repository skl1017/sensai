# Default agent configuration, assembled by `app.py::build_agent` (wiki §9.1).
# `pipeline` order is execution order (see CLAUDE.md "Pipeline"); adding a
# feature is one line here plus one registry entry in `app.py`.

llm:
  provider: ollama
  model: qwen2.5:3b            # must match OLLAMA_MODEL in .env (pulled by docker compose)
  embed_model: nomic-embed-text
  host: http://localhost:11434
  max_context_tokens: 8192

persona: default                 # config/personas/default.yaml
prompt_version: v2

pipeline:                      # list order = execution order (wiki §9)
  - persist: { dir: sessions/, persist_blocked: false }
  - context:
      sections: [persona, profile, fewshot]
      budget: { reserve_output: 1024, trigger_ratio: 0.8, keep_last_turns: 4 }
      rewrite_query: false
      fewshot: { k: 3, min_score: 0.5 }   # below 0.5 (nomic-embed-text) examples are off-topic
  - react: { max_iterations: 8, tool_timeout: 30, max_observation_chars: 4000 }

tools:
  - calculator
  - ask_user
