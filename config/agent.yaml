# Default agent configuration, assembled by `app.py::build_agent` (wiki §9.1).
# `pipeline` order is execution order (see CLAUDE.md "Pipeline"); adding a
# feature is one line here plus one registry entry in `app.py`.

llm:
  provider: ollama
  model: qwen2.5:3b            # must match OLLAMA_MODEL in .env (pulled by docker compose)
  embed_model: nomic-embed-text
  host: http://localhost:11434
  max_context_tokens: 8192

reranker:                      # rag `rerank: true`; needs `pip install -e '.[rerank]'`
  provider: fastembed          # local cross-encoder (ONNX, CPU); `llm` grades with the chat model
  model: jinaai/jina-reranker-v2-base-multilingual
  cache_dir: data/models

persona: default                 # config/personas/default.yaml
prompt_version: v2

pipeline:                      # list order = execution order (wiki §9)
  - persist: { dir: sessions/, persist_blocked: false }
  - input_guardrail: { max_chars: 4000, rules: config/guardrails.yaml, scope_check: false }
  - cache: { threshold: 0.96, ttl_hours: 24, mode: first_turn_only }   # bench/cache_threshold.md
  - context:
      sections: [persona, profile, memory, fewshot, rag]
      budget: { reserve_output: 1024, trigger_ratio: 0.8, keep_last_turns: 4 }
      rewrite_query: false
      fewshot: { k: 3, min_score: 0.5 }   # below 0.5 (nomic-embed-text) examples are off-topic
      rag: { k: 20, min_score: 0.3, rerank: true, rerank_min_score: 0.1, top_k: 4 }
  - react: { max_iterations: 8, tool_timeout: 30, max_observation_chars: 4000 }
  - output_guardrail: { strict: false, pii: [email, phone, iban, card], rules: config/guardrails.yaml }

tools:
  - calculator
  - ask_user
  - memory
  - read_file
  - list_dir
  - write_file
  - web_search: { url: http://localhost:8080 } # provider: serpapi if SERPAPI_API_KEY is set, else searxng
  - run_python: { backend: docker }

approval:
  - memory_forget
  - write_file
  - run_python

# agents:                       # sub-agents exposed as `ask_<name>` tools (A2)
#   - name: tutor
#     config: agents/tutor.yaml  # relative to this file
#     description: "Tuteur de mathématiques : explique un calcul ou une notion mathématique pas à pas."
#     max_depth: 2               # nesting depth limit
#     max_calls: 3               # calls of this sub-agent per request
#     timeout: 120               # seconds, a whole sub-agent ReAct loop

mcp_servers:
  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
    read_only: []
